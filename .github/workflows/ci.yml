name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 渲染测试 · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: macos-latest,   python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest,  python: "3.9" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: 单元测试（离线渲染全部风格）
        run: pytest tests/ -v

      - name: 平台体检
        shell: bash
        run: python tools/doctor.py | tee doctor.txt

      - name: 出图（作为跨平台渲染证据归档）
        shell: bash
        run: python tools/preview.py --out preview

      - name: 上传出图与体检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            preview/
            doctor.txt
          if-no-files-found: ignore

  # macOS 壁纸设置至今没有真机确认过。本 job 在真实 macOS runner 上跑一次，
  # 结果写进 Job Summary 供观察；不阻塞 CI（尚未验证的能力不该拦住提交）。
  macos-live-wallpaper:
    name: macOS 壁纸实机验证（仅观测）
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -e .

      - name: 出图 + 真实尝试设为桌面壁纸
        shell: bash
        run: python tools/doctor.py --apply > macos-apply.txt 2>&1 || true

      - name: 输出结果
        shell: bash
        run: |
          cat macos-apply.txt
          {
            echo "## macOS 壁纸设置实机结果"
            echo ""
            echo '```'
            cat macos-apply.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: macos-wallpaper-result
          path: macos-apply.txt
